[project]
name = "osr"
version = "0.1.0"
description = "Pre-registered regime-gating study of NIFTY short-volatility and long-index strategies"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "hmmlearn>=0.3.3",
    "jumpmodels>=0.1.1",
    "arch>=7.0",
    "pyarrow>=16",
    "requests>=2.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:hmmlearn"]
